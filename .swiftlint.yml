# SwiftLint Configuration for AudioWaveLib
# Enforces strict Swift coding standards

# Files to exclude from linting
excluded:
  - .build
  - .swiftpm
  - Examples/AudioWaveLibSample/main.swift  # Allow relaxed rules for example code

# Opt-in rules (beyond defaults)
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prefixed_toplevel_constant
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - switch_case_on_newline
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Disabled rules
disabled_rules:
  - todo  # Allow TODO comments for development

# Configure specific rules
rules:
  # CRITICAL: Force operations as ERRORS
  force_unwrapping:
    severity: error
  force_cast:
    severity: error
  force_try:
    severity: error

  # Line length
  line_length:
    warning: 120
    error: 140

  # Function body length
  function_body_length:
    warning: 50
    error: 100

  # Type body length
  type_body_length:
    warning: 200
    error: 300

  # File length
  file_length:
    warning: 400
    error: 500

  # Function parameter count
  function_parameter_count:
    warning: 5
    error: 8

  # Cyclomatic complexity
  cyclomatic_complexity:
    warning: 10
    error: 15

  # Nesting depth
  nesting:
    type_level:
      warning: 2
      error: 3
    statement_level:
      warning: 5
      error: 10

  # Identifier naming
  identifier_name:
    min_length:
      warning: 2
      error: 1
    max_length:
      warning: 50
      error: 60
    excluded:
      - id
      - x
      - y
      - z

  # Type name
  type_name:
    min_length:
      warning: 3
      error: 2
    max_length:
      warning: 40
      error: 50

  # Large tuple
  large_tuple:
    warning: 3
    error: 4

  # Trailing whitespace
  trailing_whitespace:
    ignores_empty_lines: false
    ignores_comments: false

  # Vertical whitespace
  vertical_whitespace:
    max_empty_lines: 2

  # Multiple closures with trailing closure
  multiple_closures_with_trailing_closure:
    severity: error

  # Implicit getter
  implicit_getter:
    severity: warning

  # Redundant optional initialization
  redundant_optional_initialization:
    severity: error

  # Syntactic sugar
  syntactic_sugar:
    severity: error

  # Empty parameters
  empty_parameters:
    severity: error

  # Empty parentheses with trailing closure
  empty_parentheses_with_trailing_closure:
    severity: error

# Custom rules for project-specific requirements
custom_rules:
  no_print_statements:
    name: "No Print Statements"
    regex: 'print\('
    message: "Use proper logging instead of print()"
    severity: warning

  no_nslog:
    name: "No NSLog"
    regex: 'NSLog\('
    message: "Use proper logging instead of NSLog()"
    severity: warning

  no_fatalError_without_message:
    name: "fatalError Must Have Message"
    regex: 'fatalError\(\s*\)'
    message: "fatalError() must include a descriptive message"
    severity: error

# Analyzer rules for additional static analysis
analyzer_rules:
  - unused_import
  - unused_declaration